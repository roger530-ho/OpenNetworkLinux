######################################################################
#
# platform-config for APRESIA CA120 32T16X
#
######################################################################

x86-64-apresia-ca120-32t16x-r0:

  grub:

    serial: >-
      --port=0x3f8
      --speed=115200
      --word=8
      --parity=no
      --stop=1
    kernel:
      <<: *kernel-5-4

    args: >-
      console=ttyS0,115200n8
      intel_iommu=off

  network:
    interfaces:
      ma1:
        name: eth0
